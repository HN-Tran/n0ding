name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify source
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hn-tran/n0ding
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Attest image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/hn-tran/n0ding
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Prepare release assets
        run: |
          cp deploy/compose.yaml compose.yaml
          cp deploy/n0ding.toml n0ding.toml
          sha256sum compose.yaml n0ding.toml install.sh install.ps1 > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "n0ding ${GITHUB_REF_NAME}" \
            compose.yaml n0ding.toml install.sh install.ps1 SHA256SUMS
