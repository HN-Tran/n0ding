name: CI

on:
  push:
    branches: ["main", "automation/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w -X main.version=ci" -o dist/n0ding ./cmd/n0ding
      - run: ./dist/n0ding -config config/n0ding.local.toml -check-config

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate source Compose defaults to loopback
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose config --format json | python3 -c '
          import json, sys
          config = json.load(sys.stdin)
          ports = config["services"]["n0ding"].get("ports", [])
          if not ports or any(port.get("host_ip") != "127.0.0.1" for port in ports):
              raise SystemExit(f"source Compose must publish only to loopback by default: {ports!r}")
          '
      - run: docker compose -f deploy/compose.yaml config --quiet
      - run: docker build --build-arg VERSION=ci --tag n0ding:ci .
      - name: Validate authenticated public deployment
        run: |
          set -euo pipefail
          cp deploy/public/.env.example deploy/public/.env
          cp /etc/ssl/certs/ca-certificates.crt deploy/public/client-ca.pem
          printf '%064d\n' 0 > deploy/public/operator-token
          docker compose --project-directory deploy/public config --quiet
          docker run --rm \
            --env N0DING_PUBLIC_URL=https://packages.example.com \
            --volume "$PWD/deploy/public/n0ding.toml:/etc/n0ding/n0ding.toml:ro" \
            n0ding:ci -config /etc/n0ding/n0ding.toml -check-config
          docker run --rm \
            --env N0DING_DOMAIN=packages.example.com \
            --volume "$PWD/deploy/public/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --volume "$PWD/deploy/public/client-ca.pem:/etc/caddy/client-ca.pem:ro" \
            caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Validate installers
        shell: pwsh
        run: |
          sh -n install.sh
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$null,
            [ref]$Errors
          ) | Out-Null
          if ($Errors.Count -gt 0) {
            $Errors | Format-List | Out-String | Write-Error
          }

  dockerized-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: make docker-test
      - run: make docker-check

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Start Compose and verify endpoints
        run: |
          set -euo pipefail

          docker compose config --quiet
          docker compose up --build -d

          cleanup() {
            docker compose logs --no-color n0ding || true
            docker compose down
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/tmp/n0ding-healthz; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/n0ding-healthz 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/status | tee /tmp/n0ding-status.json
          curl -fsS http://localhost:8080/metrics | tee /tmp/n0ding-metrics.txt
          grep -E '^n0ding_' /tmp/n0ding-metrics.txt

  pypi-real-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install uv client
        run: python -m pip install --disable-pip-version-check uv
      - name: Verify pip and uv through persistent PyPI cache
        run: |
          set -euo pipefail

          docker compose up --build -d
          cleanup() {
            docker compose logs --no-color n0ding || true
            docker compose down
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done

          python --version
          python -m pip --version
          uv --version

          python -m pip install --no-deps \
            --target /tmp/pip-run-1 \
            --cache-dir /tmp/pip-cache-1 \
            --index-url http://localhost:8080/pypi/simple/ \
            idna==3.10
          uv venv /tmp/uv-env-1
          UV_CACHE_DIR=/tmp/uv-cache-1 uv pip install \
            --python /tmp/uv-env-1/bin/python \
            --index-url http://localhost:8080/pypi/simple/ \
            idna==3.10

          curl -fsS http://localhost:8080/api/v1/status >/tmp/n0ding-status-before.json

          docker compose restart n0ding
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done

          python -m pip install --no-deps \
            --target /tmp/pip-run-2 \
            --cache-dir /tmp/pip-cache-2 \
            --index-url http://localhost:8080/pypi/simple/ \
            idna==3.10
          uv venv /tmp/uv-env-2
          UV_CACHE_DIR=/tmp/uv-cache-2 uv pip install \
            --python /tmp/uv-env-2/bin/python \
            --index-url http://localhost:8080/pypi/simple/ \
            idna==3.10

          curl -fsS http://localhost:8080/api/v1/status >/tmp/n0ding-status-after.json
          python - <<'PY'
          import json

          def pypi_snapshot(path):
              with open(path, encoding="utf-8") as stream:
                  status = json.load(stream)
              return next(repo for repo in status["repositories"] if repo["type"] == "pypi")

          before = pypi_snapshot("/tmp/n0ding-status-before.json")
          after = pypi_snapshot("/tmp/n0ding-status-after.json")
          assert before["cache_misses"] >= 2, before
          assert before["cache_objects"] >= 2, before
          assert before["errors"] == 0, before
          assert after["cache_hits"] >= 2, after
          assert after["cache_objects"] == before["cache_objects"], (before, after)
          assert after["errors"] == 0, after
          print(json.dumps({"before_restart": before, "after_restart": after}, indent=2, sort_keys=True))
          PY

          test "$(sha256sum /tmp/pip-run-1/idna/__init__.py | cut -d' ' -f1)" = \
            "$(sha256sum /tmp/pip-run-2/idna/__init__.py | cut -d' ' -f1)"

  private-pypi-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check build twine uv
      - name: Publish with Twine and install with pip and uv
        run: ./tools/private-pypi-smoke.sh

  release-candidate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Exercise npm, pip, uv, and OCI across restart
        run: ./tools/release-candidate-smoke.sh

  public-vps-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check uv
      - run: docker build --build-arg VERSION=ci --tag n0ding:public-vps-ci .
      - run: ./tools/public-vps-smoke.sh

  multi-arch-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build unpublished AMD64 and ARM64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=release-candidate
          outputs: type=oci,dest=${{ runner.temp }}/n0ding.oci.tar
      - name: Verify OCI archive
        run: test -s "${RUNNER_TEMP}/n0ding.oci.tar"

  installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Run staged installer smoke
        run: python tools/installer-smoke.py

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run stopped Compose backup/restore drill
        shell: pwsh
        run: ./tools/backup-restore-drill.ps1

  soak-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run short retention/concurrency smoke
        shell: pwsh
        run: ./tools/retention-soak.ps1 -Mode Smoke
