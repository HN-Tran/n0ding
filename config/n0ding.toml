[server]
listen = ":8080"
public_base_url = "${N0DING_PUBLIC_URL}"
log_level = "info"

[storage]
path = "/data"

[repository.npm]
type = "npm"
path = "/npm/"
upstream = "https://registry.npmjs.org"
ttl = "24h"
forward_authorization = false

[repository.oci]
type = "oci"
path = "/v2/"
upstream = "https://registry-1.docker.io"
ttl = "1h"
