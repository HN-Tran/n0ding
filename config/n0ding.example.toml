# Copy this file and adjust the client-visible URL and storage path.
# n0ding expands environment variables inside string values.

[server]
listen = ":8080"
public_base_url = "http://localhost:8080"
log_level = "info"

[storage]
path = "./data"
# Complete objects are removed this long after their cache commit.
# This is not a disk-size bound; monitor the filesystem containing this path.
max_age = "720h"
gc_interval = "1h"
# Cache-created temporary writes older than this are removed at startup.
stale_temp_age = "1h"

[repository.npm]
type = "npm"
path = "/npm/"
upstream = "https://registry.npmjs.org"
ttl = "24h"
forward_authorization = false

[repository.oci]
type = "oci"
# Standard OCI/Docker clients require the Registry V2 path.
path = "/v2/"
upstream = "https://registry-1.docker.io"
ttl = "1h"

[repository.pypi]
type = "pypi"
path = "/pypi/simple/"
upstream = "https://pypi.org/simple"
ttl = "24h"
# Distribution file URLs are rewritten and cached only for these explicit
# origins plus the configured upstream origin.
allowed_file_origins = "https://files.pythonhosted.org"
forward_authorization = false
# Optional: enables immutable private uploads at /pypi/legacy/.
# publish_token_file = "../secrets/pypi-publish-token"
