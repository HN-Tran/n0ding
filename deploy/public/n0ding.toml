[server]
listen = ":8080"
public_base_url = "${N0DING_PUBLIC_URL}"
log_level = "info"

[storage]
path = "/data"
max_age = "720h"
gc_interval = "1h"
stale_temp_age = "1h"
max_bytes = 107374182400
high_watermark = 0.90
low_watermark = 0.75
min_free_bytes = 10737418240

[operator]
token_file = "/run/secrets/n0ding-operator-token"

[repository.npm]
type = "npm"
path = "/npm/"
upstream = "https://registry.npmjs.org"
ttl = "24h"
forward_authorization = false

[repository.oci]
type = "oci"
path = "/v2/"
upstream = "https://registry-1.docker.io"
ttl = "1h"

[repository.pypi]
type = "pypi"
path = "/pypi/simple/"
upstream = "https://pypi.org/simple"
ttl = "24h"
allowed_file_origins = "https://files.pythonhosted.org"
forward_authorization = false
